<text x="520.0" y="486.0" font-size="11.5" fill="#5B6B7C" >Median and 2.5th–97.5th percentiles over 100 draws per level; × = design not estimable.</text>
<text x="520.0" y="506.0" font-size="12.5" fill="#243247" >Per-gene detectable effect of the v1 disease fits (median gene, discovery / HECA):</text>
<text x="520.0" y="526.0" font-size="11.5" fill="#5B6B7C" >1.5× / 1.5× (α 0.05) · 2.2× / 2.3× (100 BH discoveries) · 3.3× / 3.4× (one)</text>
<text x="520.0" y="556.0" font-size="11.5" fill="#243247" >Reading: 22 donors recover even a large known program inconsistently.</text>
<text x="1025.0" y="118.0" font-size="17" fill="#243247" >C. Secretory stromal program: disease interaction θ</text>
