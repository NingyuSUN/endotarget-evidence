<line x1="100.00" y1="227.50" x2="470.00" y2="227.50" stroke="#dce2e9" stroke-width="1" />
<text x="90.0" y="231.5" font-size="11" fill="#5B6B7C" text-anchor="end">6,000</text>
<line x1="100.00" y1="160.00" x2="470.00" y2="160.00" stroke="#dce2e9" stroke-width="1" />
<text x="90.0" y="164.0" font-size="11" fill="#5B6B7C" text-anchor="end">8,000</text>
<line x1="135.00" y1="428.50" x2="190.00" y2="428.50" stroke="#9AA5B1" stroke-width="3" />
