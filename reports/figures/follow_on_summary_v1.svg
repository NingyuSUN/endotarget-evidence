<text x="1025.0" y="428.0" font-size="11.5" fill="#5B6B7C" >Gate AUC 1.000 / 0.986; secretory shift 1.26 / 0.56 units.</text>
<text x="1025.0" y="448.0" font-size="11.5" fill="#5B6B7C" >Shaded: detectable with 80% power. Label: no_detectable_difference.</text>
<text x="1025.0" y="486.0" font-size="12.5" fill="#243247" >Against each cohort’s own secretory shift, the intervals exclude:</text>
