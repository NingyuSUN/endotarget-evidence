<text x="1025.0" y="526.0" font-size="11.5" fill="#5B6B7C" >enhancement above 20.1% and 33.9%.</text>
<text x="1025.0" y="556.0" font-size="11.5" fill="#243247" >Reading: no detectable program-level difference; the HECA bound is wide.</text>
