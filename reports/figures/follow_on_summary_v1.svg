<text x="35.0" y="610.0" font-size="11" fill="#5B6B7C" >Sources: reports/mde_analysis (v1 and phase MDE summaries, subsampling curves), reports/secretory_program (summaries), receipts/phase_positive_control_evaluation.json, reports/replication_v2_dossier_pool.tsv.</text>
<text x="35.0" y="628.0" font-size="11" fill="#5B6B7C" >Rules for every analysis were frozen and hashed before data; v1 artifacts unchanged. Receipt: receipts/summary_figure_follow_on_v1.json. Nothing here is disease evidence or a target claim.</text>
