<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
<title id="title">What the null means: follow-on analyses of the v1 benchmark</title>
<desc id="desc">Three panels rendered from published tables: detection and transfer of the disease and cycle-phase contrasts, recovery of the phase program by donor number, and the secretory program disease interaction with its detectable effect.</desc>
<rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, Arial, sans-serif">
<text x="35.0" y="40.0" font-size="24" fill="#243247" >What the null means: the v1 pipeline under four prespecified follow-on analyses</text>
<text x="35.0" y="66.0" font-size="14" fill="#5B6B7C" >Rendered from published summaries and receipts; no model rerun. Disease contrast: 22 proliferative donors per cohort. Follow-on contrasts add the secretory arms: 35 (discovery) and 42 (HECA) donors.</text>
<text x="35.0" y="118.0" font-size="17" fill="#243247" >A. Genes at BH q &lt; 0.05: disease versus cycle phase</text>
<text x="35.0" y="138.0" font-size="12" fill="#5B6B7C" >Same estimator, filter, normalization and covariates; only the contrast differs</text>
<line x1="100.00" y1="430.00" x2="470.00" y2="430.00" stroke="#dce2e9" stroke-width="1" />
<text x="90.0" y="434.0" font-size="11" fill="#5B6B7C" text-anchor="end">0</text>
<line x1="100.00" y1="362.50" x2="470.00" y2="362.50" stroke="#dce2e9" stroke-width="1" />
<text x="90.0" y="366.5" font-size="11" fill="#5B6B7C" text-anchor="end">2,000</text>
<line x1="100.00" y1="295.00" x2="470.00" y2="295.00" stroke="#dce2e9" stroke-width="1" />
