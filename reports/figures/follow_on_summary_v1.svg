<rect x="380.00" y="295.47" width="55.00" height="134.53" fill="#EE7733" />
<text x="407.5" y="287.5" font-size="12" fill="#243247" text-anchor="middle">3,986</text>
<text x="407.5" y="446.0" font-size="11" fill="#5B6B7C" text-anchor="middle">phase</text>
<text x="377.0" y="466.0" font-size="12" fill="#243247" text-anchor="middle">HECA (E-MTAB-14039, snRNA)</text>
<text x="35.0" y="486.0" font-size="12.5" fill="#243247" >Frozen expression (B0) top-20 transferred to HECA:</text>
<text x="35.0" y="506.0" font-size="11.5" fill="#5B6B7C" >disease: 14 / 20 / 20 same direction / evaluable / selected; 0 at external q &lt; 0.05</text>
<text x="35.0" y="526.0" font-size="11.5" fill="#5B6B7C" >phase: 20 / 20 / 20 same direction; 20 at external q &lt; 0.05</text>
<text x="35.0" y="556.0" font-size="11.5" fill="#243247" >Reading: the null is not pipeline insensitivity; phase genes are not a shortlist.</text>
<text x="520.0" y="118.0" font-size="17" fill="#243247" >B. Recovery of the phase program by donor number</text>
<text x="520.0" y="138.0" font-size="12" fill="#5B6B7C" >Subsampled studies of n + n donors re-analyzed with the v1 estimator (primary design)</text>
