<text x="30" y="555" font-size="14" fill="#243247" >Matching uses discovery expression and network degree only; external disease outcomes do not select the sets.</text>
<text x="30" y="581" font-size="14" fill="#243247" >All 600 frozen sets meet coverage requirements. Observed lists retain their own missingness; no replacement genes are added.</text>
<text x="30" y="607" font-size="14" fill="#243247" >Orange line = observed fixed list. The descriptive position does not establish ranking accuracy, therapeutic validity or a calibrated significance test.</text>
<text x="30" y="633" font-size="14" fill="#243247" >See the paired external-donor bootstrap and discovery leave-one-donor-out panels for their distinct uncertainty/stability questions.</text>
