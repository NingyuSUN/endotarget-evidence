name: CI

# Software checks only: synthetic unit tests of the project code. They are not a
# biological or clinical validation and do not rerun any scientific analysis.
# The exact scientific runtime is the locked micromamba environment
# (requirements/statistical-runtime.explicit.txt) and its Docker image; the R
# job below uses the matching Bioconductor release series, not the byte-exact lock.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python unit tests (3.10, pinned probe lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements/metadata-probe.txt
      - name: Install the pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/metadata-probe.txt
          python -m pip freeze
      - name: Mount the checkout at the documented project path
        # The scripts retain /home/analyst/te as their required project path and the
        # tested runtime bind-mounts the checkout there (docs/LOCAL_EXECUTION.md).
        run: |
          sudo mkdir -p /home/analyst/te
          sudo mount --bind "$GITHUB_WORKSPACE" /home/analyst/te
          mkdir -p /home/analyst/te/tmp   # git-ignored scratch directory the freeze tests expect
          git -C /home/analyst/te rev-parse --short HEAD
      - name: Run the unit tests
        working-directory: /home/analyst/te
        run: python scripts/run_unit_tests.py
      - name: Check relative Markdown links
        working-directory: /home/analyst/te
        run: python scripts/check_markdown_links.py

  r-tests:
    name: R synthetic checks (Bioconductor 3.20)
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_20
    steps:
      - uses: actions/checkout@v5
      - name: Install edgeR, limma, statmod and jsonlite
        run: |
          Rscript -e 'BiocManager::install(c("edgeR", "limma", "statmod", "jsonlite"), ask = FALSE, update = FALSE)'
          Rscript -e 'for (p in c("edgeR", "limma", "statmod", "jsonlite")) cat(p, as.character(packageVersion(p)), "\n"); cat(R.version.string, "\n")'
      - name: Donor-level model checks
        run: Rscript tests/test_donor_de.R
      - name: Clinical sensitivity selection checks
        run: Rscript tests/test_clinical_sensitivities.R
